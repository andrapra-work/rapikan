[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rapikan"
version = "0.1.0"
description = "Explainable preprocessing for informal Indonesian text: negation-safe, typed tokens, task presets, own stemmer."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT (code); LGPL-3.0 (bundled root-word list, see src/rapikan/data/LICENSE-roots-LGPL-3.0.txt)" }
authors = [{ name = "Andra Pradana Ardiansyah" }]
keywords = ["nlp", "indonesian", "bahasa indonesia", "preprocessing", "stemmer", "slang", "tts", "stt"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
  "Natural Language :: Indonesian",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/andrapra-work/rapikan"
Issues = "https://github.com/andrapra-work/rapikan/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]
bench = ["Sastrawi>=1.0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rapikan = ["data/*.txt", "data/*.tsv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--doctest-modules src/rapikan tests"
